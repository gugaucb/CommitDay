services:
  commitday:
    image: gugaucb/commitday:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commitday
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - STORAGE_TYPE=${STORAGE_TYPE:-sqlite}
      - DATA_DIR=/app/data
      - PORT=3000
    volumes:
      # Volume persistente no diretório host ./data para que dados do SQLite nunca sejam perdidos
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
